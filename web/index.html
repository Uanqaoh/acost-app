<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Acost 只读展示：账单、收支统计与小票。"><meta name="theme-color" content="#f5f5f5">
<title>Acost · 账本</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script>
</head>
<body>
<aside class="sidebar"><div class="profile" aria-label="只读账本"><span data-icon="book"></span></div><span class="read-label">只读</span>
<nav aria-label="主导航"><button class="nav-item active" data-action="ledger"><span data-icon="book"></span><span>账本</span></button><button class="nav-item" data-action="accounts"><span data-icon="layers"></span><span>资产</span></button><button class="nav-item" data-action="stats"><span data-icon="chart"></span><span>统计</span></button><button class="nav-item" data-action="settings"><span data-icon="settings"></span><span>设置</span></button></nav>
<div class="sidebar-bottom"><button class="icon-button" id="sidebar-refresh" aria-label="刷新账本"><span data-icon="refresh"></span></button><button class="icon-button" data-action="help" aria-label="使用说明"><span data-icon="help"></span></button></div></aside>
<header class="topbar"><div class="book-name"><span class="book-mark" data-icon="sun"></span><span id="book-name">默认账本</span><span id="demo-badge" class="demo-badge" hidden>演示数据</span></div><h1>账本</h1><div class="top-actions"><button id="search-toggle"><span data-icon="search"></span>搜索账单</button><button id="statistics-button">按月统计</button></div></header>
<main>
<div class="statusline"><span id="dataset-note">正在连接账本…</span><button id="refresh"><span id="sync-dot" class="dot"></span><span id="sync-status">正在同步</span><span data-icon="refresh"></span></button></div>
<div id="error-banner" class="error-banner" role="alert" hidden><span id="error-text"></span><button id="retry">重新连接</button></div>
<div class="workspace">
<section class="analytics" aria-label="月度统计">
<div class="summary-grid">
<article class="summary-card expense-card"><h2><span data-icon="expense"></span>总支出</h2><strong id="total-expense">—</strong><div class="card-foot"><div>总收入 <b id="total-income">—</b></div><div>结余 <b id="total-net">—</b></div></div></article>
<article class="summary-card budget-card"><h2><span data-icon="budget"></span>剩余预算</h2><strong class="unconfigured">未设置</strong><div class="card-foot">尚未设置月度预算<br>按实际收支查看本月花费</div></article>
<article class="summary-card claim-card"><h2><span data-icon="refund"></span>待报销</h2><strong class="unconfigured">未启用</strong><div class="card-foot">暂无报销记录功能<br>退款已在支出中抵扣</div></article>
<article class="summary-card asset-card"><h2><span data-icon="wallet"></span>净资产</h2><strong id="total-assets" class="unconfigured">未初始化</strong><div class="card-foot" id="asset-foot">账户期初余额尚未核对<br>不作为实际资产余额</div></article>
</div>
<div class="analysis-grid">
<div class="charts-column">
<article class="panel flow-panel"><div class="panel-heading"><h2><span class="yellow-icon" data-icon="chart"></span><span id="flow-title">支出统计图</span></h2><span id="flow-average" class="muted"></span></div><div class="chart-selection" id="flow-selection">—</div><div class="bar-chart" id="flow-chart" aria-label="每日收支图"></div><div class="chart-axis"><span id="flow-start">—</span><span id="flow-mid">—</span><span id="flow-end">—</span></div><div class="segmented" id="flow-tabs" aria-label="图表类型"><button class="selected" data-flow="expense">支出</button><button data-flow="income">收入</button><button data-flow="net">结余</button></div></article>
<article class="panel asset-panel"><div class="panel-heading"><h2><span class="yellow-icon" data-icon="trend"></span>资产变动趋势</h2></div><div class="chart-selection" id="movement-value">—</div><div id="movement-chart" class="movement-chart"></div><div class="chart-axis"><span id="asset-start">—</span><span id="asset-mid">—</span><span id="asset-end">—</span></div><div class="chart-caption">本月累计收支 · 不含转账</div><p class="panel-note">显示本月净变动，不代表实际净资产。</p></article>
</div>
<article class="panel category-panel"><div class="panel-heading"><h2><span class="yellow-icon" data-icon="pie"></span><span id="category-title">支出分类详情</span></h2><button class="small-button" id="clear-category" hidden>清除筛选</button></div><div class="donut-wrap"><svg id="donut" viewBox="0 0 300 300" role="img" aria-label="分类占比图"></svg><div class="donut-label"><span id="donut-label">总支出</span><strong id="donut-total">—</strong></div></div><div class="segmented" id="category-tabs" aria-label="分类类型"><button class="selected" data-category-type="expense">支出</button><button data-category-type="income">收入</button></div><div id="category-list" class="category-list"></div><p id="category-note" class="panel-note"></p></article>
</div>
</section>
<section class="day-column" aria-label="月历与账单">
<div class="month-bar"><button id="previous-month" aria-label="上个月"><span data-icon="arrow-left"></span></button><label><span id="month-label">—</span><input id="month-input" type="month" aria-label="选择月份"></label><button id="next-month" aria-label="下个月"><span data-icon="arrow-right"></span></button></div>
<article class="panel calendar-panel"><div class="weekdays" aria-hidden="true"><span>周日</span><span>周一</span><span>周二</span><span>周三</span><span>周四</span><span>周五</span><span>周六</span></div><div id="calendar" class="calendar" aria-label="选择日期"></div></article>
<div id="search-panel" class="panel search-panel" hidden><label class="search-field"><span data-icon="search"></span><input id="search-input" type="search" maxlength="300" placeholder="搜索本月商家、备注或分类" aria-label="搜索本月账单"></label><div class="filters"><select id="type-filter" aria-label="账单类型"><option value="">全部类型</option><option value="expense">支出</option><option value="expense-net">支出及退款</option><option value="income">收入</option><option value="refund">退款</option><option value="transfer">转账</option></select><select id="account-filter" aria-label="账户"><option value="">全部账户</option></select><select id="category-filter" aria-label="分类"><option value="">全部分类</option></select><button id="reset-filters" class="text-button">重置</button></div></div>
<div class="day-heading"><button id="day-title" title="切换当天和整月账单">—</button><span id="day-total"></span><button id="all-days" class="text-button">整月</button></div>
<div class="panel entries-panel" id="entries-list"><div class="empty-state">正在读取账单…</div></div>
<div class="ledger-footer"><span id="entry-count">—</span><span>金额单位 CAD</span></div>
</section>
</div>
</main>
<dialog id="detail-dialog"><div class="dialog-header"><h2 id="dialog-title">账单详情</h2><button class="icon-button" id="close-dialog" aria-label="关闭"><span data-icon="close"></span></button></div><div id="dialog-body"></div></dialog>
</body></html>
